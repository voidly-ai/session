# Copied and sealed by the public-tree assembler. Publish only from the public
# repository's reviewed v<version> tag, never from an untracked assembled folder.
# Configure npm's exact trusted publisher and protect npm-publish BEFORE dispatch.
# Naming an environment does not create its reviewers or prove npm authority.
name: publish @voidly/session

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact stable package version, matching the public v<version> tag."
        required: true
        type: string
      source_sha:
        description: "Reviewed 40-character public commit SHA targeted by that tag."
        required: true
        type: string
      mode:
        description: "stage waits for separate maintainer 2FA approval; direct publishes immediately."
        required: true
        type: choice
        options: [stage, direct]
        default: stage
      confirm:
        description: "Type STAGE for stage mode, or PUBLISH for direct mode."
        required: true
        type: string
        default: ""
      dry_run:
        description: "Leave true to validate without staging or publishing."
        required: true
        type: boolean
        default: true
      dist_tag:
        description: "npm distribution tag; staging fixes this tag until approval."
        required: true
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: publish-voidly-session
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'voidly-ai/session' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRM: ${{ inputs.confirm }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Validate release inputs
        id: inputs
        run: |
          set -euo pipefail
          node <<'NODE'
          const e = process.env;
          const refuse = () => { throw new Error('Release input or dispatch identity refused'); };
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(e.RELEASE_VERSION || '') || e.RELEASE_VERSION.length > 64) refuse();
          if (!/^[0-9a-f]{40}$/.test(e.RELEASE_SOURCE_SHA || '')) refuse();
          if (!/^[a-z][a-z0-9-]{0,31}$/.test(e.RELEASE_DIST_TAG || '')) refuse();
          if (!['stage', 'direct'].includes(e.RELEASE_MODE) || !['true', 'false'].includes(e.RELEASE_DRY_RUN)) refuse();
          if (e.RELEASE_CONFIRM !== (e.RELEASE_MODE === 'stage' ? 'STAGE' : 'PUBLISH')) refuse();
          if (e.GITHUB_REPOSITORY !== 'voidly-ai/session' || e.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
              e.GITHUB_REF !== `refs/tags/v${e.RELEASE_VERSION}` || e.GITHUB_SHA !== e.RELEASE_SOURCE_SHA) refuse();
          console.log(`Reviewed release ${e.RELEASE_VERSION}; mode=${e.RELEASE_MODE}; dry_run=${e.RELEASE_DRY_RUN}`);
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public source and manifest
        id: source
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync, statSync } = require('node:fs');
          const e = process.env;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 20000 }).trim();
          const refuse = () => { throw new Error('Public source or package identity refused'); };
          if (git('remote', 'get-url', 'origin') !== 'https://github.com/voidly-ai/session' &&
              git('remote', 'get-url', 'origin') !== 'https://github.com/voidly-ai/session.git') refuse();
          if (git('rev-parse', 'HEAD') !== e.RELEASE_SOURCE_SHA ||
              git('rev-parse', `${e.GITHUB_REF}^{commit}`) !== e.RELEASE_SOURCE_SHA) refuse();
          git('merge-base', '--is-ancestor', e.RELEASE_SOURCE_SHA, 'refs/remotes/origin/main');
          if (git('status', '--porcelain')) refuse();
          const p = JSON.parse(readFileSync('voidly-session-sdk/package.json', 'utf8'));
          if (p.name !== '@voidly/session' || p.version !== e.RELEASE_VERSION || p.private === true ||
              p.repository?.url !== 'git+https://github.com/voidly-ai/session.git' || p.license !== 'Apache-2.0') refuse();
          for (const file of ['LICENSE', 'NOTICE']) if (!statSync(`voidly-session-sdk/${file}`).isFile() || !readFileSync(`voidly-session-sdk/${file}`).length) refuse();
          if (!statSync('package-lock.json').isFile() || !statSync('assembly-seal.json').isFile()) refuse();
          console.log(`Public source https://github.com/voidly-ai/session/commit/${e.RELEASE_SOURCE_SHA}`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Pin the trusted publishing toolchain
        id: toolchain
        run: |
          set -euo pipefail
          npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
          node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]<22 || (v[0]===22 && v[1]<14)) process.exit(1)'
          test "$(npm --version)" = "11.15.0"

      - name: Require an unpublished registry version
        id: registry
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            let response;
            try {
              response = await fetch(`https://registry.npmjs.org/@voidly%2Fsession/${process.env.RELEASE_VERSION}`, { redirect: 'manual', signal: controller.signal });
              if (response.status !== 404 || response.redirected) throw new Error('Version exists or registry absence is unproven');
              console.log('Registry returned explicit version-not-found; staged-version conflicts remain registry-enforced.');
            } finally {
              controller.abort(); clearTimeout(timer);
              if (response?.body && !response.body.locked) await response.body.cancel().catch(() => {});
            }
          })().catch(() => { console.error('Registry availability check refused'); process.exitCode = 1; });
          NODE

      - name: Install the sealed dependency graph
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        working-directory: voidly-session-sdk
        run: npm run typecheck

      - name: Build
        id: build
        working-directory: voidly-session-sdk
        run: npm run build

      - name: Test
        id: tests
        working-directory: voidly-session-sdk
        run: npm test

      - name: Gate — tarball contents
        id: gate_tarball
        working-directory: voidly-session-sdk
        run: npm run gate

      - name: Gate — assembly seal
        id: gate_seal
        working-directory: voidly-session-sdk
        run: npm run gate:narrative

      - name: Gate — origin attributability
        id: gate_origin
        working-directory: voidly-session-sdk
        run: npm run gate:origin

      - name: Recheck the public tag before publication
        id: tag_recheck
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const e = process.env;
          const ref = `refs/tags/v${e.RELEASE_VERSION}`;
          const lines = execFileSync('git', ['ls-remote', 'origin', ref, `${ref}^{}`], { encoding: 'utf8', timeout: 20000 }).trim().split('\n');
          const rows = lines.map(line => line.split('\t'));
          if (!rows.length || rows.length > 2 || rows.some(([sha, name, extra]) => extra !== undefined || !/^[0-9a-f]{40}$/.test(sha) || ![ref, `${ref}^{}`].includes(name)) || new Set(rows.map(row => row[1])).size !== rows.length) throw new Error('Public release tag refused');
          const commit = rows.find(row => row[1] === `${ref}^{}`)?.[0] ?? rows.find(row => row[1] === ref)?.[0];
          if (!rows.some(row => row[1] === ref) || commit !== e.RELEASE_SOURCE_SHA) throw new Error('Public release tag changed');
          console.log('Public release tag still names the reviewed source.');
          NODE

      - name: Rehearse without registry writes
        id: dry_run
        if: ${{ inputs.dry_run }}
        working-directory: voidly-session-sdk
        run: |
          set -euo pipefail
          npm pack --dry-run
          echo 'Validation only: no package staged or published; publishing authority remains untested.'

      - name: Stage for separate maintainer approval
        id: stage
        if: ${{ !inputs.dry_run && inputs.mode == 'stage' }}
        working-directory: voidly-session-sdk
        run: |
          set -euo pipefail
          npm stage publish --provenance --access public --tag "$RELEASE_DIST_TAG"
          echo 'Staged only. A maintainer must inspect and approve with 2FA on npm before public availability.'
          echo 'After approval, independently verify the public version, source commit, tarball and provenance.'

      - name: Publish directly with configured authority
        id: publish
        if: ${{ !inputs.dry_run && inputs.mode == 'direct' }}
        working-directory: voidly-session-sdk
        run: |
          set -euo pipefail
          npm publish --provenance --access public --tag "$RELEASE_DIST_TAG"

      - name: Require public source and attestation metadata
        id: verify_public
        if: ${{ !inputs.dry_run && inputs.mode == 'direct' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            sleep 10
            if timeout 20s npm view "@voidly/session@$RELEASE_VERSION" --json > "$RUNNER_TEMP/session-published.json"; then
              if node <<'NODE'
          const { readFileSync } = require('node:fs');
          const p = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/session-published.json`, 'utf8'));
          const e = process.env;
          if (p.name !== '@voidly/session' || p.version !== e.RELEASE_VERSION || p.gitHead !== e.RELEASE_SOURCE_SHA ||
              p.repository?.url !== 'git+https://github.com/voidly-ai/session.git' || !p.dist?.integrity ||
              typeof p.dist?.attestations?.url !== 'string' || !p.dist.attestations.url.startsWith('https://registry.npmjs.org/-/npm/v1/attestations/')) process.exit(1);
          console.log('Public version/source/attestation metadata match. Independent tarball and signature verification is still required.');
          NODE
              then exit 0; fi
            fi
          done
          echo 'Publication may have succeeded, but public source/attestation evidence is incomplete. Inspect the exact version; do not republish blindly.'
          exit 1
